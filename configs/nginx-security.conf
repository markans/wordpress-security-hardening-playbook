# WordPress Security Hardening - Production Nginx Configuration Snippets
# Author: Mark Anthony Garcia (GEENXT)
# Repository: https://github.com/markans/wordpress-security-hardening-playbook
# Reference Guide: https://www.geenxt.com/blog/how-to-harden-wordpress-security/

# 1. Block PHP Execution in Uploads and Writable Directories
# Prevents executed web shells or backdoor scripts if an attacker uploads a malicious file.
location ~* ^/wp-content/uploads/.*\.php$ {
    deny all;
    access_log off;
    log_not_found off;
}

location ~* ^/wp-content/plugins/.*\.php$ {
    # Allow legitimate direct plugin scripts if required, otherwise restrict execution:
    # Uncomment to restrict direct access to plugin PHP files:
    # deny all;
}

# 2. Protect Sensitive WordPress Core Configuration Files
location ~* /(wp-config\.php|readme\.html|license\.txt) {
    deny all;
    access_log off;
    log_not_found off;
}

# 3. Block Hidden Files and Version Control Metadata
# Denies access to .git, .env, .htaccess, and backup dumps (.sql, .bak, .swp)
location ~ /\.(?!well-known).* {
    deny all;
    access_log off;
    log_not_found off;
}

location ~* \.(sql|bak|swp|dist|inc|old|orig|save|test|tpl|log)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# 4. Disable XML-RPC Endpoint
# XML-RPC is obsolete for most modern sites and serves as a major vector for brute-force and amplification attacks.
location = /xmlrpc.php {
    deny all;
    access_log off;
    log_not_found off;
}

# 5. Restrict REST API User Enumeration
# Prevents unauthorized attackers from scanning user logins via /wp-json/wp/v2/users
location ~* ^/wp-json/wp/v2/users {
    # If using authentication proxies or custom login endpoints, adjust accordingly.
    # Returns 403 Forbidden to unauthenticated scanners:
    return 403;
}

# 6. Rate Limit Login Endpoints
# Define the rate limiting zone in your main nginx.conf http block:
# limit_req_zone $binary_remote_addr zone=wplogin:10m rate=2r/s;
location = /wp-login.php {
    limit_req zone=wplogin burst=5 nodelay;
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock; # Adjust to your PHP-FPM socket or port
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
}

# 7. Defensive HTTP Security Headers
# Add defensive headers to mitigate clickjacking, MIME sniffing, and cross-site scripting risks.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
